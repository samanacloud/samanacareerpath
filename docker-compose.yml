
services:
 
  backend:
    build:
      context: ./backend  # Path to the directory containing the Dockerfile
      dockerfile: Dockerfile
    container_name: ${PROJECT_CODENAME}_backend
    env_file:
      - ./.env 
    ports:
      - "${BACKEND_PORT}:8000" 
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - pt-network
    volumes:
      - ./backend/src:/app/src
    environment:
      - PYTHONPATH=/app/src


  mongodb:
    image: mongo:6.0
    container_name: ${PROJECT_CODENAME}_mongodb
    command: mongod --auth --bind_ip 0.0.0.0 --port 27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - project_mongodb_data:/data/db
      - ./mongodb/init-scripts:/docker-entrypoint-initdb.d/
      - ./mongodb/backups:/mongodb/backups:ro
    restart: always
    env_file:
      - ./.env
    networks:
      - pt-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${PROJECT_CODENAME}_frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend/src:/usr/src/app/src
      - /usr/src/app/node_modules
    working_dir: /usr/src/app/src
    environment:
      - NODE_ENV=development
      - VITE_BASE_URL=https://${PROJECT_URL}
      - VITE_API_URL=https://${PROJECT_URL}/core
      - VITE_WS_URL=wss://${PROJECT_URL}/ws
    restart: always
    env_file:
      - .env 
    networks:
      - pt-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ${PROJECT_CODENAME}_nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template
      - ./nginx/ssl:/etc/nginx/ssl
    environment:
      - PROJECT_URL=${PROJECT_URL}
      - PROJECT_NAME=${PROJECT_NAME}
      - PROJECT_CODENAME=${PROJECT_CODENAME}
      - BACKEND_PORT=${BACKEND_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
    depends_on:
      - backend
      - frontend
    networks:
      - pt-network


networks:
  pt-network:
    name: "${PROJECT_NAME}_network"
    driver: bridge

volumes:
  project_mongodb_data:
    name: "${PROJECT_NAME}_mongodb_data"
  nginx_logs:
    name: "${PROJECT_NAME}_nginx_logs"
