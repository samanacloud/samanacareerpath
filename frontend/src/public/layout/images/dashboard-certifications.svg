<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="certGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#certGradient)" rx="20" />
  
  <!-- Certification Cards -->
  <rect x="50" y="50" width="300" height="200" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Certification 1 -->
  <rect x="70" y="70" width="120" height="80" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="90" cy="90" r="10" fill="#06B6D4" opacity="0.7"/>
  <rect x="110" y="85" width="60" height="10" rx="2" fill="#4B5563"/>
  <rect x="110" y="105" width="40" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="70" y="130" width="120" height="10" rx="5" fill="#06B6D4" opacity="0.3"/>
  
  <!-- Certification 2 -->
  <rect x="210" y="70" width="120" height="80" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="230" cy="90" r="10" fill="#06B6D4" opacity="0.7"/>
  <rect x="250" y="85" width="60" height="10" rx="2" fill="#4B5563"/>
  <rect x="250" y="105" width="40" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="210" y="130" width="120" height="10" rx="5" fill="#06B6D4" opacity="0.3"/>
  
  <!-- Certification 3 -->
  <rect x="70" y="160" width="120" height="80" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="90" cy="180" r="10" fill="#06B6D4" opacity="0.7"/>
  <rect x="110" y="175" width="60" height="10" rx="2" fill="#4B5563"/>
  <rect x="110" y="195" width="40" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="70" y="220" width="120" height="10" rx="5" fill="#06B6D4" opacity="0.3"/>
  
  <!-- Certification 4 -->
  <rect x="210" y="160" width="120" height="80" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="230" cy="180" r="10" fill="#06B6D4" opacity="0.7"/>
  <rect x="250" y="175" width="60" height="10" rx="2" fill="#4B5563"/>
  <rect x="250" y="195" width="40" height="8" rx="2" fill="#9CA3AF"/>
  <rect x="210" y="220" width="120" height="10" rx="5" fill="#06B6D4" opacity="0.3"/>
  
  <!-- Badge Icons -->
  <circle cx="170" cy="110" r="15" fill="#06B6D4" opacity="0.5" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="310" cy="110" r="15" fill="#06B6D4" opacity="0.5" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="170" cy="200" r="15" fill="#06B6D4" opacity="0.5" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="310" cy="200" r="15" fill="#06B6D4" opacity="0.5" stroke="#FFFFFF" stroke-width="2"/>
</svg> 