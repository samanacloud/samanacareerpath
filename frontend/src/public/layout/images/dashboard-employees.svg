  <rect x="220" y="165" width="100" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="220" y="165" width="50" height="8" rx="4" fill="#6366F1" opacity="0.7"/>
  
  <rect x="220" y="205" width="100" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="220" y="205" width="90" height="8" rx="4" fill="#6366F1" opacity="0.7"/>
  
