<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skillsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skillsGradient)" rx="20" />
  
  <!-- Skills Chart -->
  <rect x="50" y="50" width="300" height="200" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Chart Title -->
  <rect x="70" y="70" width="100" height="15" rx="2" fill="#8B5CF6" opacity="0.7"/>
  
  <!-- Radar Chart (Simplified) -->
  <polygon points="200,100 250,130 230,180 170,180 150,130" fill="#8B5CF6" opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="200" cy="150" r="60" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="200" cy="150" r="40" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="200" cy="150" r="20" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Skill Labels -->
  <rect x="70" y="100" width="60" height="10" rx="2" fill="#E5E7EB"/>
  <rect x="70" y="120" width="40" height="10" rx="2" fill="#E5E7EB"/>
  <rect x="70" y="140" width="50" height="10" rx="2" fill="#E5E7EB"/>
  <rect x="70" y="160" width="45" height="10" rx="2" fill="#E5E7EB"/>
  <rect x="70" y="180" width="55" height="10" rx="2" fill="#E5E7EB"/>
  
  <!-- Skill Bars -->
  <rect x="70" y="220" width="260" height="20" rx="10" fill="#F3F4F6"/>
  <rect x="70" y="220" width="180" height="20" rx="10" fill="#8B5CF6" opacity="0.7"/>
</svg> 