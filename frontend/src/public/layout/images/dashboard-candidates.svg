<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="candidateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#candidateGradient)" rx="20" />
  
  <!-- Candidate Pipeline -->
  <rect x="50" y="50" width="300" height="200" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Pipeline Stages -->
  <rect x="70" y="80" width="50" height="140" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="130" y="80" width="50" height="140" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="190" y="80" width="50" height="140" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="250" y="80" width="50" height="140" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Stage Labels -->
  <rect x="70" y="70" width="50" height="10" rx="2" fill="#10B981" opacity="0.7"/>
  <rect x="130" y="70" width="50" height="10" rx="2" fill="#10B981" opacity="0.7"/>
  <rect x="190" y="70" width="50" height="10" rx="2" fill="#10B981" opacity="0.7"/>
  <rect x="250" y="70" width="50" height="10" rx="2" fill="#10B981" opacity="0.7"/>
  
  <!-- Candidate Cards in Pipeline -->
  <rect x="75" y="100" width="40" height="25" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <rect x="75" y="135" width="40" height="25" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <rect x="75" y="170" width="40" height="25" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  
  <rect x="135" y="100" width="40" height="25" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <rect x="135" y="135" width="40" height="25" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  
  <rect x="195" y="100" width="40" height="25" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <rect x="195" y="135" width="40" height="25" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  
  <rect x="255" y="100" width="40" height="25" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  
  <!-- Candidate Count Indicators -->
  <circle cx="105" y="230" r="10" fill="#10B981" opacity="0.7"/>
  <circle cx="165" y="230" r="10" fill="#10B981" opacity="0.7"/>
  <circle cx="225" y="230" r="10" fill="#10B981" opacity="0.7"/>
  <circle cx="285" y="230" r="10" fill="#10B981" opacity="0.7"/>
</svg> 