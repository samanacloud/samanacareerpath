<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="welcomeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#welcomeGradient)" rx="20" />
  
  <!-- Dashboard Grid -->
  <rect x="50" y="60" width="300" height="180" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="70" y="80" width="120" height="20" rx="4" fill="#3B82F6" opacity="0.7"/>
  <rect x="70" y="110" width="80" height="10" rx="2" fill="#E5E7EB"/>
  
  <!-- Widgets -->
  <rect x="70" y="140" width="80" height="60" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="160" y="140" width="80" height="60" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="250" y="140" width="80" height="60" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  
  <rect x="70" y="210" width="170" height="80" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1" opacity="0.7"/>
  <rect x="250" y="210" width="80" height="80" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1" opacity="0.7"/>
  
  <!-- Decorative Elements -->
  <circle cx="110" y="170" r="15" fill="#3B82F6" opacity="0.3"/>
  <circle cx="200" y="170" r="15" fill="#10B981" opacity="0.3"/>
  <circle cx="290" y="170" r="15" fill="#F59E0B" opacity="0.3"/>
</svg> 